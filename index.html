<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Online Report Form</title>

<style>
/* =========================================================
   GLOBAL
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --bg-1: #020817;
    --bg-2: #06152e;
    --bg-3: #0a2345;

    --glass: rgba(15, 38, 72, 0.55);
    --glass-light: rgba(255, 255, 255, 0.07);
    --glass-border: rgba(255, 255, 255, 0.13);

    --text: #f4f8ff;
    --muted: #9fb1c9;

    --primary: #2588ff;
    --primary-dark: #1265c5;

    --success: #28d17c;
    --danger: #ff5d6c;
    --warning: #ffc857;

    --shadow: 0 25px 70px rgba(0, 0, 0, 0.40);
}

html,
body {
    min-height: 100%;
}

body {
    font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    color: var(--text);

    background:
        radial-gradient(circle at 15% 20%, rgba(37, 136, 255, 0.18), transparent 30%),
        radial-gradient(circle at 85% 75%, rgba(0, 100, 255, 0.15), transparent 30%),
        linear-gradient(
            135deg,
            var(--bg-1),
            var(--bg-2),
            var(--bg-3),
            var(--bg-1)
        );

    background-attachment: fixed;
    overflow-x: hidden;
}

button,
input,
textarea,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

/* =========================================================
   BACKGROUND DECORATION
========================================================= */

.background {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: -1;
}

.orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(5px);
    opacity: 0.45;
    animation: floating 10s ease-in-out infinite;
}

.orb.one {
    width: 280px;
    height: 280px;
    background: #075bc4;
    top: -100px;
    left: -80px;
}

.orb.two {
    width: 220px;
    height: 220px;
    background: #06377e;
    right: -70px;
    top: 30%;
    animation-delay: 2s;
}

.orb.three {
    width: 170px;
    height: 170px;
    background: #147cf5;
    left: 35%;
    bottom: -70px;
    animation-delay: 4s;
}

@keyframes floating {
    0%,
    100% {
        transform: translate(0, 0);
    }

    50% {
        transform: translate(20px, -25px);
    }
}

/* =========================================================
   APP CONTAINER
========================================================= */

.app {
    min-height: 100vh;
    width: 100%;
    padding: 20px;
}

/* =========================================================
   GLASS
========================================================= */

.glass {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
    box-shadow: var(--shadow);
}

/* =========================================================
   LOGIN
========================================================= */

#loginPage {
    min-height: calc(100vh - 40px);

    display: flex;
    justify-content: center;
    align-items: center;

    transition:
        opacity 0.5s ease,
        transform 0.5s ease;
}

.login-card {
    width: min(430px, 100%);
    padding: 42px 34px;

    border-radius: 28px;

    position: relative;
    overflow: hidden;
}

.login-card::before {
    content: "";

    position: absolute;
    width: 180px;
    height: 180px;

    border-radius: 50%;

    background: rgba(37, 136, 255, 0.13);

    top: -90px;
    right: -70px;

    pointer-events: none;
}

.logo {
    width: 72px;
    height: 72px;

    border-radius: 22px;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        linear-gradient(
            135deg,
            rgba(37, 136, 255, 0.9),
            rgba(9, 77, 158, 0.8)
        );

    box-shadow:
        0 15px 40px rgba(37, 136, 255, 0.25),
        inset 0 1px 0 rgba(255, 255, 255, 0.25);

    font-size: 28px;
    font-weight: 800;

    margin-bottom: 24px;
}

.login-card h1 {
    font-size: 29px;
    margin-bottom: 8px;
}

.login-card > p {
    color: var(--muted);
    margin-bottom: 30px;
}

/* =========================================================
   FORM ELEMENTS
========================================================= */

.form-group {
    margin-bottom: 19px;
}

.form-group label {
    display: block;

    color: #d9e6f8;

    font-size: 14px;
    font-weight: 600;

    margin-bottom: 8px;
}

.input-wrapper {
    position: relative;
}

.input-wrapper span {
    position: absolute;
    left: 15px;
    top: 50%;
    transform: translateY(-50%);

    opacity: 0.6;

    pointer-events: none;
}

.form-control {
    width: 100%;

    padding: 14px 15px 14px 45px;

    color: white;

    background: rgba(0, 9, 25, 0.35);

    border: 1px solid rgba(255, 255, 255, 0.12);

    border-radius: 14px;

    outline: none;

    transition:
        border 0.25s ease,
        box-shadow 0.25s ease,
        background 0.25s ease;
}

textarea.form-control {
    min-height: 130px;
    resize: vertical;
    padding-left: 15px;
}

select.form-control {
    padding-left: 15px;
}

.form-control::placeholder {
    color: #7589a5;
}

.form-control:focus {
    border-color: rgba(37, 136, 255, 0.75);

    background: rgba(0, 12, 30, 0.55);

    box-shadow:
        0 0 0 4px rgba(37, 136, 255, 0.09),
        0 8px 25px rgba(0, 0, 0, 0.15);
}

/* =========================================================
   BUTTONS
========================================================= */

.btn {
    border: none;

    padding: 13px 20px;

    border-radius: 14px;

    color: white;

    font-weight: 700;

    position: relative;
    overflow: hidden;

    transition:
        transform 0.18s ease,
        box-shadow 0.25s ease,
        opacity 0.25s ease;
}

.btn:hover {
    transform: translateY(-2px);
}

.btn:active {
    transform: scale(0.96);
}

.btn-primary {
    width: 100%;

    background:
        linear-gradient(
            135deg,
            #2588ff,
            #1265c5
        );

    box-shadow:
        0 12px 30px rgba(37, 136, 255, 0.25);
}

.btn-secondary {
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.12);
}

.btn-success {
    background:
        linear-gradient(
            135deg,
            #26c979,
            #149b59
        );
}

.btn-danger {
    background:
        linear-gradient(
            135deg,
            #ff6876,
            #d83b4b
        );
}

.btn-small {
    padding: 10px 15px;
    font-size: 13px;
}

/* Ripple */

.ripple {
    position: absolute;

    border-radius: 50%;

    transform: scale(0);

    animation: rippleAnimation 0.6s linear;

    background: rgba(255, 255, 255, 0.30);

    pointer-events: none;
}

@keyframes rippleAnimation {
    to {
        transform: scale(4);
        opacity: 0;
    }
}

/* =========================================================
   LOGIN ERROR
========================================================= */

.error-message {
    display: none;

    padding: 11px 13px;

    margin-bottom: 17px;

    border-radius: 12px;

    background: rgba(255, 93, 108, 0.12);

    border: 1px solid rgba(255, 93, 108, 0.25);

    color: #ff9ca5;

    font-size: 13px;
}

.error-message.show {
    display: block;

    animation: shake 0.35s ease;
}

@keyframes shake {
    0%,
    100% {
        transform: translateX(0);
    }

    25% {
        transform: translateX(-6px);
    }

    75% {
        transform: translateX(6px);
    }
}

/* =========================================================
   MAIN APP
========================================================= */

#mainPage {
    display: none;

    min-height: calc(100vh - 40px);

    opacity: 0;
}

#mainPage.visible {
    display: block;

    animation: pageFadeIn 0.6s ease forwards;
}

@keyframes pageFadeIn {
    from {
        opacity: 0;
        transform: translateY(12px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.page-exit {
    animation: pageFadeOut 0.45s ease forwards;
}

@keyframes pageFadeOut {
    from {
        opacity: 1;
        transform: translateY(0);
    }

    to {
        opacity: 0;
        transform: translateY(-10px);
    }
}

/* =========================================================
   HEADER
========================================================= */

.header {
    max-width: 1400px;
    margin: auto;

    padding: 17px 20px;

    border-radius: 22px;

    display: flex;

    justify-content: space-between;
    align-items: center;

    gap: 15px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 13px;
}

.brand-icon {
    width: 45px;
    height: 45px;

    border-radius: 14px;

    display: flex;
    justify-content: center;
    align-items: center;

    background:
        linear-gradient(
            135deg,
            #2588ff,
            #0d58a9
        );

    font-weight: 800;
}

.brand-text h2 {
    font-size: 17px;
}

.brand-text small {
    color: var(--muted);
}

.user-area {
    display: flex;
    align-items: center;
    gap: 12px;
}

.user-badge {
    padding: 8px 12px;

    border-radius: 12px;

    background: rgba(255, 255, 255, 0.06);

    border: 1px solid rgba(255, 255, 255, 0.08);

    font-size: 13px;
}

/* =========================================================
   DASHBOARD
========================================================= */

.dashboard {
    max-width: 1400px;

    margin: 24px auto 0;
}

.welcome-card {
    padding: 30px;

    border-radius: 24px;

    margin-bottom: 20px;

    position: relative;
    overflow: hidden;
}

.welcome-card::after {
    content: "";

    position: absolute;

    width: 250px;
    height: 250px;

    border-radius: 50%;

    background: rgba(37, 136, 255, 0.08);

    right: -100px;
    top: -100px;
}

.welcome-card h1 {
    font-size: clamp(25px, 4vw, 38px);
    margin-bottom: 8px;
}

.welcome-card p {
    color: var(--muted);
    max-width: 650px;
}

/* =========================================================
   SECTION GRID
========================================================= */

.section-grid {
    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(210px, 1fr)
        );

    gap: 15px;
}

.section-card {
    padding: 20px;

    border-radius: 20px;

    min-height: 160px;

    cursor: pointer;

    position: relative;

    transition:
        transform 0.25s ease,
        border-color 0.25s ease,
        background 0.25s ease;
}

.section-card:hover {
    transform: translateY(-5px);

    border-color:
        rgba(37, 136, 255, 0.45);

    background:
        rgba(20, 50, 90, 0.65);
}

.section-number {
    width: 39px;
    height: 39px;

    border-radius: 12px;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        rgba(37, 136, 255, 0.15);

    color: #69acff;

    font-weight: 800;

    margin-bottom: 15px;
}

.section-card h3 {
    font-size: 16px;
    margin-bottom: 6px;
}

.section-card p {
    color: var(--muted);
    font-size: 12px;
}

.status {
    position: absolute;

    right: 15px;
    top: 15px;

    font-size: 11px;

    padding: 5px 8px;

    border-radius: 8px;
}

.status.pending {
    background: rgba(255, 200, 87, 0.1);
    color: var(--warning);
}

.status.completed {
    background: rgba(40, 209, 124, 0.1);
    color: var(--success);
}

/* =========================================================
   FORM PAGE
========================================================= */

#formPage {
    display: none;

    max-width: 1000px;

    margin: 24px auto;
}

.form-container {
    padding: 30px;

    border-radius: 25px;
}

/* =========================================================
   FORM HEADER
========================================================= */

.form-header {
    display: flex;

    justify-content: space-between;
    align-items: center;

    gap: 15px;

    margin-bottom: 25px;
}

.form-title h2 {
    font-size: 25px;
}

.form-title p {
    color: var(--muted);

    margin-top: 5px;

    font-size: 13px;
}

/* =========================================================
   PROGRESS
========================================================= */

.progress-container {
    margin-bottom: 28px;
}

.progress-top {
    display: flex;

    justify-content: space-between;

    margin-bottom: 9px;

    color: var(--muted);

    font-size: 12px;
}

.progress-bar {
    height: 8px;

    border-radius: 10px;

    background: rgba(255, 255, 255, 0.07);

    overflow: hidden;
}

.progress-fill {
    height: 100%;

    width: 0%;

    border-radius: inherit;

    background:
        linear-gradient(
            90deg,
            #1265c5,
            #2588ff
        );

    transition: width 0.5s ease;
}

/* =========================================================
   FIELD GRID
========================================================= */

.fields {
    display: grid;

    grid-template-columns:
        repeat(
            2,
            minmax(0, 1fr)
        );

    gap: 18px;
}

.field.full {
    grid-column: 1 / -1;
}

.field label {
    display: block;

    margin-bottom: 8px;

    color: #dbe8f7;

    font-size: 13px;

    font-weight: 600;
}

.field input,
.field textarea,
.field select {
    width: 100%;

    padding: 13px;

    border-radius: 13px;

    border: 1px solid rgba(255, 255, 255, 0.11);

    background: rgba(0, 10, 25, 0.34);

    color: white;

    outline: none;

    transition:
        border 0.2s ease,
        box-shadow 0.2s ease;
}

.field textarea {
    min-height: 120px;
    resize: vertical;
}

.field input:focus,
.field textarea:focus,
.field select:focus {
    border-color: rgba(37, 136, 255, 0.7);

    box-shadow:
        0 0 0 4px rgba(37, 136, 255, 0.08);
}

/* =========================================================
   FORM FOOTER
========================================================= */

.form-actions {
    display: flex;

    justify-content: space-between;

    gap: 12px;

    margin-top: 30px;

    padding-top: 20px;

    border-top:
        1px solid rgba(255, 255, 255, 0.08);
}

.action-right {
    display: flex;

    gap: 10px;
}

/* =========================================================
   TOAST
========================================================= */

#toast {
    position: fixed;

    right: 20px;
    bottom: 20px;

    max-width: 350px;

    padding: 14px 17px;

    border-radius: 14px;

    background:
        rgba(10, 27, 51, 0.92);

    border:
        1px solid rgba(255, 255, 255, 0.13);

    backdrop-filter: blur(20px);

    box-shadow: var(--shadow);

    transform:
        translateY(120px);

    opacity: 0;

    transition:
        all 0.35s ease;

    z-index: 1000;

    font-size: 13px;
}

#toast.show {
    transform: translateY(0);
    opacity: 1;
}

#toast.success {
    border-color:
        rgba(40, 209, 124, 0.35);
}

#toast.error {
    border-color:
        rgba(255, 93, 108, 0.35);
}

/* =========================================================
   LOADING
========================================================= */

.loading-overlay {
    position: fixed;

    inset: 0;

    display: none;

    align-items: center;
    justify-content: center;

    background:
        rgba(1, 7, 18, 0.68);

    backdrop-filter: blur(8px);

    z-index: 9999;
}

.loading-overlay.show {
    display: flex;
}

.loader-card {
    padding: 28px;

    border-radius: 20px;

    text-align: center;
}

.spinner {
    width: 42px;
    height: 42px;

    border-radius: 50%;

    border:
        3px solid rgba(255, 255, 255, 0.1);

    border-top-color: #2588ff;

    animation:
        spin 0.8s linear infinite;

    margin: auto auto 14px;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

    .app {
        padding: 10px;
    }

    #loginPage {
        min-height: calc(100vh - 20px);
    }

    .login-card {
        padding: 32px 22px;

        border-radius: 22px;
    }

    .header {
        padding: 13px;

        border-radius: 18px;
    }

    .brand-text h2 {
        font-size: 15px;
    }

    .user-badge {
        display: none;
    }

    .dashboard {
        margin-top: 14px;
    }

    .welcome-card {
        padding: 23px;

        border-radius: 20px;
    }

    .section-grid {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
    }

    .section-card {
        min-height: 145px;

        padding: 15px;
    }

    .section-card h3 {
        font-size: 14px;
    }

    #formPage {
        margin: 14px auto;
    }

    .form-container {
        padding: 20px 15px;

        border-radius: 20px;
    }

    .form-header {
        align-items: flex-start;

        flex-direction: column;
    }

    .fields {
        grid-template-columns: 1fr;
    }

    .field.full {
        grid-column: auto;
    }

    .form-actions {
        flex-direction: column;
    }

    .action-right {
        width: 100%;
    }

    .action-right .btn {
        flex: 1;
    }

    #toast {
        left: 12px;
        right: 12px;
        bottom: 12px;
        max-width: none;
    }
}

@media (max-width: 400px) {

    .section-grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<!-- =======================================================
     BACKGROUND
======================================================= -->

<div class="background">
    <div class="orb one"></div>
    <div class="orb two"></div>
    <div class="orb three"></div>
</div>

<div class="app">

<!-- =======================================================
     LOGIN PAGE
======================================================= -->

<section id="loginPage">

    <div class="login-card glass">

        <div class="logo">
            OR
        </div>

        <h1>Online Report</h1>

        <p>
            Sign in to access your reporting dashboard.
        </p>

        <div
            id="loginError"
            class="error-message">
        </div>

        <form id="loginForm">

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <div class="input-wrapper">

                    <span>👤</span>

                    <input
                        id="username"
                        class="form-control"
                        type="text"
                        placeholder="Enter username"
                        autocomplete="username"
                        required>

                </div>

            </div>

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="input-wrapper">

                    <span>🔐</span>

                    <input
                        id="password"
                        class="form-control"
                        type="password"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required>

                </div>

            </div>

            <button
                id="loginButton"
                type="submit"
                class="btn btn-primary">

                Login

            </button>

        </form>

    </div>

</section>


<!-- =======================================================
     MAIN PAGE
======================================================= -->

<section id="mainPage">

    <!-- HEADER -->

    <header class="header glass">

        <div class="brand">

            <div class="brand-icon">
                OR
            </div>

            <div class="brand-text">

                <h2>
                    Online Report Form
                </h2>

                <small>
                    Reporting Dashboard
                </small>

            </div>

        </div>

        <div class="user-area">

            <div
                id="loggedUser"
                class="user-badge">
            </div>

            <button
                id="logoutButton"
                class="btn btn-danger btn-small">

                Logout

            </button>

        </div>

    </header>


    <!-- DASHBOARD -->

    <main
        id="dashboard"
        class="dashboard">

        <div class="welcome-card glass">

            <h1>
                Welcome, <span id="welcomeUser"></span>
            </h1>

            <p>
                Complete your report section by section.
                Your progress will be saved to your assigned
                Google Sheet.
            </p>

        </div>


        <div
            id="sectionGrid"
            class="section-grid">
        </div>

    </main>


    <!-- ===================================================
         FORM PAGE
    =================================================== -->

    <section id="formPage">

        <div class="form-container glass">

            <div class="form-header">

                <div class="form-title">

                    <h2 id="formSectionTitle">
                        Section 1
                    </h2>

                    <p id="formSectionDescription">
                        Complete the information below.
                    </p>

                </div>

                <button
                    id="backToDashboard"
                    class="btn btn-secondary btn-small">

                    ← Dashboard

                </button>

            </div>


            <!-- PROGRESS -->

            <div class="progress-container">

                <div class="progress-top">

                    <span id="progressText">
                        Section 1 of 17
                    </span>

                    <span id="progressPercent">
                        0%
                    </span>

                </div>

                <div class="progress-bar">

                    <div
                        id="progressFill"
                        class="progress-fill">
                    </div>

                </div>

            </div>


            <!-- FORM -->

            <form id="reportForm">

                <div
                    id="dynamicFields"
                    class="fields">
                </div>


                <div class="form-actions">

                    <button
                        type="button"
                        id="previousButton"
                        class="btn btn-secondary">

                        ← Previous

                    </button>

                    <div class="action-right">

                        <button
                            type="button"
                            id="saveButton"
                            class="btn btn-success">

                            Save

                        </button>

                        <button
                            type="button"
                            id="nextButton"
                            class="btn btn-primary">

                            Next →

                        </button>

                    </div>

                </div>

            </form>

        </div>

    </section>

</section>

</div>


<!-- =======================================================
     TOAST
======================================================= -->

<div id="toast"></div>


<!-- =======================================================
     LOADING
======================================================= -->

<div
    id="loadingOverlay"
    class="loading-overlay">

    <div class="loader-card glass">

        <div class="spinner"></div>

        <div id="loadingText">
            Loading...
        </div>

    </div>

</div>


<script>
/* =========================================================
   GOOGLE APPS SCRIPT CONFIGURATION
========================================================= */

/*
    IMPORTANT:

    Replace the URL below with your deployed Google Apps
    Script Web App URL.

    Example:

    https://script.google.com/macros/s/XXXXXXXXXXXX/exec
*/

const APPSCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbyH_8jVAwfGZ0E9FEOmQ2qrzNIuVvWG4gnNztzTLb64g5FZddrB-KFMXOXyMbOjZnHX4w/exec";


/* =========================================================
   GOOGLE SPREADSHEET ID

/* =========================================================

========================================================= */

loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const username =
            document
                .getElementById("username")
                .value
                .trim();

        const password =
            document
                .getElementById("password")
                .value
                .trim();

        if (!username || !password) {

            showLoginError(
                "Please enter username and password."
            );

            return;
        }

        loginButton.disabled = true;
        loginButton.textContent = "Signing in...";

        /*
            First attempt server-side authentication.
        */

        let serverLoginSuccessful = false;

        if (
            APPSCRIPT_URL &&
            !APPSCRIPT_URL.includes("YOUR_APPS_SCRIPT")
        ) {

            try {

                const result =
                    await apiRequest(
                        "login",
                        {
                            username: username,
                            password: password
                        }
                    );

                if (
                    result &&
                    result.success
                ) {

                    serverLoginSuccessful = true;

                    completeLogin(username);

                }

            } catch (error) {

                console.warn(
                    "Apps Script login failed:",
                    error
                );

            }

        }


        /*
            Temporary local fallback.

            Once Apps Script authentication is fully
            configured, remove this fallback.
        */

        if (!serverLoginSuccessful) {

            if (
                USERS[username] &&
                USERS[username] === password
            ) {

                completeLogin(username);

            } else {

                showLoginError(
                    "Invalid username or password."
                );

            }

        }

        loginButton.disabled = false;
        loginButton.textContent = "Login";
    }
);

/* =========================================================
   RENDER FIELDS
========================================================= */

function renderFields(section) {

    dynamicFields.innerHTML = "";

    if (
        !section.fields ||
        section.fields.length === 0
    ) {

        dynamicFields.innerHTML = `

            <div class="field full">

                <div
                    style="
                        padding:25px;
                        border-radius:15px;
                        background:rgba(255,255,255,.04);
                        border:1px solid rgba(255,255,255,.08);
                        color:#9fb1c9;
                        text-align:center;
                    ">

                    The fields for this section
                    will be added from your PDF
                    structure.

                </div>

            </div>
        `;

        return;
    }


    section.fields.forEach(
        field => {

            const wrapper =
                document.createElement("div");

            wrapper.className =
                "field";

            if (field.full) {

                wrapper.classList.add(
                    "full"
                );

            }


            const label =
                document.createElement(
                    "label"
                );

            label.textContent =
                field.label;

            wrapper.appendChild(label);


            let input;


            if (
                field.type ===
                "textarea"
            ) {

                input =
                    document.createElement(
                        "textarea"
                    );

            } else if (
                field.type ===
                "select"
            ) {

                input =
                    document.createElement(
                        "select"
                    );

                if (
                    field.options
                ) {

                    field.options.forEach(
                        option => {

                            const optionElement =
                                document.createElement(
                                    "option"
                                );

                            optionElement.value =
                                option.value ??
                                option;

                            optionElement.textContent =
                                option.label ??
                                option;

                            input.appendChild(
                                optionElement
                            );

                        }
                    );

                }

            } else {

                input =
                    document.createElement(
                        "input"
                    );

                input.type =
                    field.type || "text";

            }


            input.name =
                field.name;

            input.id =
                `field_${field.name}`;

            if (field.required) {

                input.required =
                    true;

            }


            const existingValue =
                getFieldValue(
                    currentSection,
                    field.name
                );

            if (
                existingValue !==
                undefined
            ) {

                input.value =
                    existingValue;

            }


            wrapper.appendChild(input);

            dynamicFields.appendChild(
                wrapper
            );

        }
    );

}


/* =========================================================

========================================================= */

function getFieldValue(
    sectionId,
    fieldName
) {

        !formData[sectionId]

        return undefined;

    return formData[
        sectionId
    ][fieldName];

}


/* =========================================================
   COLLECT FORM
========================================================= */

function collectCurrentSectionData() {

    const section =
        sections.find(
            item =>
                item.id === currentSection
        );

    if (!section) return {};


    const data = {};


    if (
        section.fields
    ) {

        section.fields.forEach(
            field => {

                const input =
                    document.getElementById(
                        `field_${field.name}`
                    );

                if (input) {

                    data[field.name] =
                        input.value;

                }

            }
        );

    }


    formData[currentSection] =
        data;

    return data;
}

    localStorage.setItem(
        `report_${currentUser}`,
        JSON.stringify({
            formData:
                formData,
            completedSections:
                completedSections
        })
    );


    /*
        Send data to Apps Script.
    */

    if (
        APPSCRIPT_URL &&
        !APPSCRIPT_URL.includes("YOUR_APPS_SCRIPT")
    ) {

        try {

            const result =
                await apiRequest(
                    "saveSection",
                    {
                        username:
                            currentUser,

                        section:
                            currentSection,

                        data:
                            formData[
                                currentSection
                            ]
                    }
                );

            if (
                result &&
                !result.success
            ) {

                throw new Error(
                    result.message ||
                    "Server rejected data."
                );

            }

        } catch (error) {

            console.error(error);

            showToast(
                "Saved locally, but server save failed.",
                "error"
            );

            return false;
        }

    }


    if (showMessage) {

        showToast(
            "Section saved successfully.",
            "success"
        );

    }

    return true;
}

/* =========================================================
   APPS SCRIPT API
========================================================= */

async function apiRequest(
    action,
    data = {}
) {

    const payload = {

        action: action,

        spreadsheetId:
            SPREADSHEET_ID,

        ...data

    };


    const response =
        await fetch(
            APPSCRIPT_URL,
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "text/plain;charset=utf-8"
                },

                body:
                    JSON.stringify(
                        payload
                    )
            }
        );


    if (!response.ok) {

        throw new Error(
            `HTTP ${response.status}`
        );

    }


    return await response.json();

}

/* =========================================================
   BUTTON ANIMATION
========================================================= */

function animateButton(
    button
) {

    const rect =
        button.getBoundingClientRect();

    const circle =
        document.createElement(
            "span"
        );

    const diameter =
        Math.max(
            rect.width,
            rect.height
        );

    circle.style.width =
        circle.style.height =
        `${diameter}px`;

    circle.style.left =
        `${
            event.clientX -
            rect.left -
            diameter / 2
        }px`;

    circle.style.top =
        `${
            event.clientY -
            rect.top -
            diameter / 2
        }px`;

    circle.classList.add(
        "ripple"
    );

    button.appendChild(
        circle
    );

    setTimeout(
        () => circle.remove(),
        650
    );

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHtml(
    text
) {

    return String(text)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}
