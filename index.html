<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Report Form</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Animated background */
        body::before {
            content: '';
            position: fixed;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: animateBackground 20s linear infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes animateBackground {
            0% {
                transform: translate(0, 0);
            }
            100% {
                transform: translate(50px, 50px);
            }
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1200px;
            padding: 20px;
        }

        /* Glass Morphism Effect */
        .glass-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            animation: fadeIn 0.8s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
                transform: translateY(0);
            }
            to {
                opacity: 0;
                transform: translateY(-20px);
            }
        }

        .fade-out {
            animation: fadeOut 0.8s ease-in-out;
        }

        /* Login Layout */
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
        }

        .logo-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-section h1 {
            color: #00d4ff;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
        }

        .logo-section p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.95rem;
            letter-spacing: 2px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 8px;
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: #fff;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .form-group input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.15);
            border-color: #00d4ff;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #00d4ff, #0084ff);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.4);
            position: relative;
            overflow: hidden;
        }

        .login-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .login-btn:hover {
            background: linear-gradient(135deg, #0084ff, #00d4ff);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.5);
        }

        .login-btn:active::before {
            width: 300px;
            height: 300px;
        }

        .error-message {
            color: #ff6b6b;
            text-align: center;
            margin-top: 15px;
            font-size: 0.9rem;
            display: none;
        }

        /* Home Layout */
        .home-container {
            display: none;
            min-height: 100vh;
            padding: 20px 0;
        }

        .home-container.show {
            display: block;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .header h1 {
            color: #00d4ff;
            font-size: 2rem;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 10px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .user-info span {
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.95rem;
        }

        .logout-btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, #ff6b6b, #ff4757);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background: linear-gradient(135deg, #ff4757, #ff6b6b);
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 71, 87, 0.4);
        }

        .form-section {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            margin-bottom: 30px;
        }

        .form-section h2 {
            color: #00d4ff;
            margin-bottom: 25px;
            font-size: 1.5rem;
            text-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: #fff;
            font-size: 0.95rem;
            font-family: inherit;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            resize: vertical;
            min-height: 100px;
        }

        .form-group textarea::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .form-group textarea:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.15);
            border-color: #00d4ff;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }

        .form-group select {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: #fff;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            cursor: pointer;
        }

        .form-group select option {
            background: #1a1a2e;
            color: #fff;
        }

        .form-group select:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.15);
            border-color: #00d4ff;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .submit-btn, .reset-btn {
            padding: 12px 40px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .submit-btn {
            background: linear-gradient(135deg, #00d4ff, #0084ff);
            color: white;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.4);
        }

        .submit-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .submit-btn:hover {
            background: linear-gradient(135deg, #0084ff, #00d4ff);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.5);
        }

        .submit-btn:active::before {
            width: 300px;
            height: 300px;
        }

        .reset-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.4);
        }

        .reset-btn:hover {
            background: linear-gradient(135deg, #764ba2, #667eea);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.5);
        }

        .success-message {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid rgba(76, 175, 80, 0.5);
            color: #4caf50;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            animation: slideIn 0.5s ease-in-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .glass-container {
                padding: 25px;
                border-radius: 15px;
            }

            .logo-section h1 {
                font-size: 1.8rem;
            }

            .form-section {
                padding: 25px;
                border-radius: 15px;
            }

            .header {
                flex-direction: column;
                text-align: center;
            }

            .header h1 {
                font-size: 1.5rem;
            }

            .user-info {
                justify-content: center;
                width: 100%;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .button-group {
                flex-direction: column;
            }

            .submit-btn, .reset-btn {
                width: 100%;
            }

            .login-btn {
                padding: 10px;
                font-size: 0.95rem;
            }

            .logout-btn {
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .glass-container {
                padding: 20px;
                border-radius: 12px;
            }

            .logo-section h1 {
                font-size: 1.5rem;
            }

            .logo-section p {
                font-size: 0.85rem;
            }

            .form-section {
                padding: 20px;
                border-radius: 12px;
            }

            .form-section h2 {
                font-size: 1.2rem;
            }

            .form-group label {
                font-size: 0.9rem;
            }

            .form-group input,
            .form-group textarea,
            .form-group select {
                font-size: 0.9rem;
                padding: 10px 12px;
            }

            .user-info {
                flex-direction: column;
                padding: 8px 15px;
            }

            .user-info span {
                font-size: 0.9rem;
            }

            .header h1 {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Login Layout -->
        <div class="login-container" id="loginContainer">
            <div class="glass-container login-box">
                <div class="logo-section">
                    <h1>📋 REPORT FORM</h1>
                    <p>ONLINE MANAGEMENT SYSTEM</p>
                </div>

                <form id="loginForm" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="username">User Name</label>
                        <input 
                            type="text" 
                            id="username" 
                            placeholder="Enter your username"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input 
                            type="password" 
                            id="password" 
                            placeholder="Enter your password"
                            required
                        >
                    </div>

                    <button type="submit" class="login-btn">LOGIN</button>

                    <div class="error-message" id="errorMessage">
                        Invalid username or password. Please try again.
                    </div>
                </form>
            </div>
        </div>

        <!-- Home Layout -->
        <div class="home-container" id="homeContainer">
            <div class="glass-container">
                <div class="header">
                    <h1>Welcome to Report Management System</h1>
                    <div class="user-info">
                        <span id="userDisplay">User: Gilgal</span>
                        <button class="logout-btn" onclick="handleLogout()">LOGOUT</button>
                    </div>
                </div>

                <div class="success-message" id="successMessage">
                    ✓ Report submitted successfully!
                </div>

                <form id="reportForm" onsubmit="handleSubmitReport(event)">
                    <!-- Personal Information Section -->
                    <div class="form-section">
                        <h2>Personal Information</h2>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="fullName">Full Name</label>
                                <input 
                                    type="text" 
                                    id="fullName" 
                                    placeholder="Enter your full name"
                                    required
                                >
                            </div>
                            <div class="form-group">
                                <label for="email">Email Address</label>
                                <input 
                                    type="email" 
                                    id="email" 
                                    placeholder="Enter your email"
                                    required
                                >
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="department">Department</label>
                                <input 
                                    type="text" 
                                    id="department" 
                                    placeholder="Enter your department"
                                    required
                                >
                            </div>
                            <div class="form-group">
                                <label for="phone">Phone Number</label>
                                <input 
                                    type="tel" 
                                    id="phone" 
                                    placeholder="Enter your phone number"
                                    required
                                >
                            </div>
                        </div>
                    </div>

                    <!-- Report Details Section -->
                    <div class="form-section">
                        <h2>Report Details</h2>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="reportType">Report Type</label>
                                <select id="reportType" required>
                                    <option value="">Select Report Type</option>
                                    <option value="incident">Incident Report</option>
                                    <option value="performance">Performance Report</option>
                                    <option value="progress">Progress Report</option>
                                    <option value="financial">Financial Report</option>
                                    <option value="other">Other</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="reportDate">Report Date</label>
                                <input 
                                    type="date" 
                                    id="reportDate" 
                                    required
                                >
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="reportTitle">Report Title</label>
                                <input 
                                    type="text" 
                                    id="reportTitle" 
                                    placeholder="Enter report title"
                                    required
                                >
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="reportDescription">Report Description</label>
                                <textarea 
                                    id="reportDescription" 
                                    placeholder="Enter detailed report description"
                                    required
                                ></textarea>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="priority">Priority Level</label>
                                <select id="priority" required>
                                    <option value="">Select Priority</option>
                                    <option value="low">Low</option>
                                    <option value="medium">Medium</option>
                                    <option value="high">High</option>
                                    <option value="critical">Critical</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="status">Status</label>
                                <select id="status" required>
                                    <option value="">Select Status</option>
                                    <option value="draft">Draft</option>
                                    <option value="submitted">Submitted</option>
                                    <option value="in-review">In Review</option>
                                    <option value="approved">Approved</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Additional Notes Section -->
                    <div class="form-section">
                        <h2>Additional Information</h2>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="remarks">Remarks / Notes</label>
                                <textarea 
                                    id="remarks" 
                                    placeholder="Add any additional remarks or notes"
                                ></textarea>
                            </div>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="button-group">
                        <button type="submit" class="submit-btn">SUBMIT REPORT</button>
                        <button type="reset" class="reset-btn">CLEAR FORM</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        // User credentials
        const users = {
            'Gilgal': '1111',
            'Tabernacle': '2222',
            'Jorkha': '3333',
            'Hmarkhawlien': '4444',
            'Chikhur': '5555',
            'Bethel': '6666',
            'Tlangmawi': '7777',
            'Zoar': '8888'
        };

        let currentUser = null;

        // Handle Login
        function handleLogin(event) {
            event.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');

            // Check if username and password match
            if (users[username] && users[username] === password) {
                currentUser = username;
                errorMessage.style.display = 'none';
                
                // Switch layouts with fade animation
                switchToHome();
            } else {
                errorMessage.style.display = 'block';
                // Clear password field
                document.getElementById('password').value = '';
            }
        }

        // Switch to Home Layout
        function switchToHome() {
            const loginContainer = document.getElementById('loginContainer');
            const homeContainer = document.getElementById('homeContainer');
            const userDisplay = document.getElementById('userDisplay');

            // Fade out login
            loginContainer.classList.add('fade-out');

            setTimeout(() => {
                loginContainer.style.display = 'none';
                homeContainer.classList.add('show');
                userDisplay.textContent = `User: ${currentUser}`;
                
                // Set today's date as default
                const today = new Date().toISOString().split('T')[0];
                document.getElementById('reportDate').value = today;
            }, 800);
        }

        // Handle Logout
        function handleLogout() {
            const loginContainer = document.getElementById('loginContainer');
            const homeContainer = document.getElementById('homeContainer');

            // Fade out home
            homeContainer.classList.add('fade-out');

            setTimeout(() => {
                homeContainer.classList.remove('show');
                homeContainer.classList.remove('fade-out');
                loginContainer.style.display = 'flex';
                loginContainer.classList.remove('fade-out');
                
                // Reset form
                document.getElementById('loginForm').reset();
                document.getElementById('reportForm').reset();
                document.getElementById('errorMessage').style.display = 'none';
                document.getElementById('successMessage').style.display = 'none';
                currentUser = null;
            }, 800);
        }

        // Handle Report Submission
        function handleSubmitReport(event) {
            event.preventDefault();

            const formData = {
                user: currentUser,
                fullName: document.getElementById('fullName').value,
                email: document.getElementById('email').value,
                department: document.getElementById('department').value,
                phone: document.getElementById('phone').value,
                reportType: document.getElementById('reportType').value,
                reportDate: document.getElementById('reportDate').value,
                reportTitle: document.getElementById('reportTitle').value,
                reportDescription: document.getElementById('reportDescription').value,
                priority: document.getElementById('priority').value,
                status: document.getElementById('status').value,
                remarks: document.getElementById('remarks').value,
                submittedAt: new Date().toLocaleString()
            };

            // Log the form data (in a real application, this would be sent to a server)
            console.log('Report Submitted:', formData);

            // Show success message
            const successMessage = document.getElementById('successMessage');
            successMessage.style.display = 'block';

            // Reset form after 2 seconds
            setTimeout(() => {
                document.getElementById('reportForm').reset();
                document.getElementById('reportDate').value = new Date().toISOString().split('T')[0];
                successMessage.style.display = 'none';
            }, 2000);

            // Optional: You can send data to a server here
            // Example:
            // fetch('/api/submit-report', {
            //     method: 'POST',
            //     headers: { 'Content-Type': 'application/json' },
            //     body: JSON.stringify(formData)
            // })
        }

        // Set today's date on page load
        window.addEventListener('DOMContentLoaded', function() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('reportDate').value = today;
        });

        // Add ripple effect to buttons (for better visual feedback)
        document.querySelectorAll('.login-btn, .submit-btn').forEach(button => {
            button.addEventListener('click', function(e) {
                const ripple = document.createElement('span');
                const rect = this.getBoundingClientRect();
                const size = Math.max(rect.width, rect.height);
                const x = e.clientX - rect.left - size / 2;
                const y = e.clientY - rect.top - size / 2;

                ripple.style.width = ripple.style.height = size + 'px';
                ripple.style.left = x + 'px';
                ripple.style.top = y + 'px';
            });
        });
    </script>
</body>
</html>
